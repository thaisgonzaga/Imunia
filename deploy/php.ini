; Acrescenta ao php.ini-production só o que o Imunia pede.

memory_limit = 256M

; Anexo de atendimento até 10 MB (AnexoAtendimento::TAMANHO_MAXIMO_KB) e foto
; do animal até 5 MB: o limite do PHP precisa estar acima dos dois, senão o
; arquivo é descartado antes de a validação poder explicar o motivo.
upload_max_filesize = 12M
post_max_size = 14M

expose_php = Off

; O código não muda dentro do contêiner: nada de conferir datas de arquivo.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
